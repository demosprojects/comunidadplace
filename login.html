<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | Comunidad Place</title>
    <link rel="shortcut icon" href="foco-nuevo-rem.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
        }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-900 h-[100dvh] flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">

    <!-- Fondo decorativo moderno (Ambient Glow) -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-yellow-400/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-yellow-400/5 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10 my-auto">
        <!-- Logo / Identidad -->
        <div class="text-center mb-6 sm:mb-8">
            <div class="text-xl sm:text-2xl font-black tracking-widest uppercase inline-block">
                <span class="bg-yellow-400 text-black px-2.5 py-0.5 rounded-md mr-1 shadow-sm">COMUNIDAD</span><span class="text-white">PLACE</span>
            </div>
        </div>

        <!-- Tarjeta del Formulario -->
        <div class="bg-white rounded-3xl p-6 sm:p-10 border border-gray-100 shadow-2xl shadow-black/20">
            <div class="mb-6">
                <h1 class="text-2xl sm:text-3xl font-black uppercase italic tracking-tight text-gray-900 mb-1">
                    Ingresar
                </h1>
                <p class="text-gray-500 text-sm font-medium">
                    Accedé a tu panel de emprendedor.
                </p>
            </div>

            <form id="form-login" class="space-y-5" novalidate>
                <!-- Input Usuario -->
                <div>
                    <label for="usuario" class="block text-[11px] font-bold uppercase mb-1.5 tracking-wider text-gray-500">
                        Usuario
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </div>
                        <input type="text" id="usuario" required autocomplete="username" placeholder="Tu nombre de usuario"
                            class="w-full pl-11 pr-4 py-3.5 bg-gray-50/50 border-2 border-gray-200/80 rounded-xl text-sm font-semibold text-gray-900 placeholder-gray-400 focus:bg-white focus:border-yellow-400 focus:ring-4 focus:ring-yellow-400/15 outline-none transition-all duration-200">
                    </div>
                </div>

                <!-- Input Contraseña -->
                <div>
                    <label for="password" class="block text-[11px] font-bold uppercase mb-1.5 tracking-wider text-gray-500">
                        Contraseña
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </div>
                        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••"
                            class="w-full pl-11 pr-12 py-3.5 bg-gray-50/50 border-2 border-gray-200/80 rounded-xl text-sm font-semibold text-gray-900 placeholder-gray-400 focus:bg-white focus:border-yellow-400 focus:ring-4 focus:ring-yellow-400/15 outline-none transition-all duration-200">
                        <!-- Botón ver/ocultar contraseña -->
                        <button type="button" id="btn-toggle-password" 
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none transition">
                            <!-- Ojo (Mostrar) -->
                            <svg id="icon-eye" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <!-- Ojo tachado (Ocultar) -->
                            <svg id="icon-eye-off" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Alerta de Error -->
                <div id="msg-error" class="hidden flex items-start gap-2.5 bg-red-50 border border-red-200 text-red-600 text-xs font-bold p-3 rounded-xl transition-all">
                    <svg class="w-4 h-4 shrink-0 mt-0.5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span id="msg-error-text"></span>
                </div>

                <!-- Botón Submit -->
                <button type="submit" id="btn-login"
                    class="w-full bg-black text-white py-4 rounded-xl font-black uppercase text-xs tracking-widest hover:bg-yellow-400 hover:text-black focus:ring-4 focus:ring-yellow-400/30 transition-all duration-200 shadow-lg shadow-black/10 active:scale-[0.98] flex items-center justify-center gap-2">
                    <span>Ingresar</span>
                </button>
            </form>
        </div>

        <!-- Enlace volver -->
        <p class="text-center mt-6">
            <a href="index.html" class="inline-flex items-center gap-1.5 text-gray-400 text-xs uppercase tracking-widest font-bold hover:text-white transition-colors py-2 px-4 rounded-lg">
                <span>← Volver a la tienda</span>
            </a>
        </p>
    </div>

    <script src="supabase-client.js"></script>
    <script src="login.js"></script>
</body>
</html>
